name: Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: hugo --minify --buildFuture

      - name: Check affiliate links earn what they promise
        # This workflow and hugo.yml both publish to GitHub Pages, and
        # whichever finishes last wins. The affiliate check therefore has
        # to run here as well - otherwise a page could promise a
        # commission on a link that earns nothing, and this workflow
        # would publish it without complaint.
        run: python scripts/check-affiliate-links.py public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
