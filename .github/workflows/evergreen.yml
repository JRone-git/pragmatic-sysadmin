name: Evergreen reshare

# Weekly rotation: resurfaces one older post on Bluesky/Mastodon so the back
# catalogue keeps earning traffic instead of dying after week one.

on:
  schedule:
    # Wednesday 09:00 UTC — mid-week, decent engagement window.
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reshare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Seed state (first run safety)
        run: python scripts/promote.py generate

      - name: Reshare one older post
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python scripts/promote.py evergreen || true

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotion/
          git diff --staged --quiet || (git commit -m "Evergreen reshare update [skip ci]" && git push)
