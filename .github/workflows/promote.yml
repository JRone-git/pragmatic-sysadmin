name: Promote new posts

# Generates pitch packages for newly published posts, auto-posts to the safe
# channels (Bluesky / Mastodon / dev.to — 48h cadence) and opens a tracking
# issue with ready-to-submit HN/Reddit drafts. See docs/PROMOTION.md.

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      # The engine itself is a trigger too: changing the pacing rules is a
      # deliberate instruction to publish, and waiting for the next content
      # commit would quietly ignore it.
      - 'scripts/promote.py'
      - 'promotion/release.yaml'
  schedule:
    # Daily retry so cadence-gated posts go out when their window opens.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the 48h channel cadence (manual override)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  issues: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Queue pitch packages for new posts
        run: python scripts/promote.py generate

      - name: Auto-post to safe channels
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
          # How many dev.to articles one run may publish. dev.to is an
          # article library, not a feed, so a small daily batch drains the
          # backlog without burying anyone's timeline. The social channels
          # ignore this - they stay at one post per run.
          DEVTO_BATCH: ${{ vars.DEVTO_BATCH || '5' }}
        # A missing secret skips that channel (status=failed with a clear
        # message) without failing the whole run for the others.
        # FORCE=true is only settable via manual dispatch — scheduled and
        # push runs always respect the 48h cadence.
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/promote.py auto-post --force --batch "$DEVTO_BATCH" || true
          else
            python scripts/promote.py auto-post --batch "$DEVTO_BATCH" || true
          fi

      - name: Create promotion issues for manual channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create promotion \
            --description "Autonomous promotion queue (HN/Reddit approval)" \
            --color D4C5F9 2>/dev/null || true
          python scripts/promote.py open-issues

      - name: Commit queue and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotion/
          git diff --staged --quiet || (git commit -m "Promotion queue update [skip ci]" && git push)
