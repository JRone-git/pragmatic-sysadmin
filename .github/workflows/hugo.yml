name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Stamp the service worker cache name
        # The Buddy service worker caches the app shell. Its cache name is
        # a hash of the shell contents, so a changed app.js produces a
        # changed sw.js, which is what makes a browser install the new
        # worker and drop the old cache. Without this, a phone keeps
        # running the copy of Buddy it cached - and only picks up a fix on
        # the second load.
        run: python scripts/bump-sw-cache.py

      - name: Build
        run: hugo --minify --buildFuture --environment production --cleanDestinationDir --gc

      - name: Check affiliate links earn what they promise
        # The site once claimed a commission on links that carried no
        # tracking at all. This check makes that impossible to reintroduce:
        # it fails the build if any page promises money on a link that
        # earns nothing.
        run: python scripts/check-affiliate-links.py public

      - name: Add .nojekyll file
        run: touch ./public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit URLs to IndexNow
        # Best effort. A slow or refusing third-party API must not be able
        # to fail the deploy - the site is already published by this point,
        # and a red build on every push hides the failures that matter.
        continue-on-error: true
        run: python scripts/submit-indexnow.py --live

      - name: Submit sitemap + inspect URLs via Google Search Console
        continue-on-error: true
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: python scripts/submit-searchconsole.py
