name: Auto-merge cline branches

# BlogForge / Cline worktrees push finished work to `cline/<id>` branches.
# This merges them straight into main so content deploys without manual
# intervention. Skips branches that are already contained in main, and
# deletes the branch after a successful merge.

on:
  push:
    branches:
      - 'cline/*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Safety: only ever merges into this repo.
    if: github.repository == 'JRone-git/pragmatic-sysadmin'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BRANCH="$GITHUB_REF_NAME"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          HDRS=(-H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN missing}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          COMPARE=$(curl -sS "${HDRS[@]}" "$API/compare/main...${BRANCH}") || {
            echo "compare request failed (network)"; exit 1
          }
          STATUS=$(echo "$COMPARE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))")
          echo "compare main...${BRANCH} => ${STATUS}"
          if [ "$STATUS" = "identical" ] || [ "$STATUS" = "behind" ]; then
            echo "::notice::${BRANCH} is already merged into main — nothing to do."
            exit 0
          fi
          echo "Merging ${BRANCH} into main (merge commit)…"
          CODE=$(curl -sS -o /tmp/merge.json -w '%{http_code}' -X PUT "${HDRS[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"base\":\"main\",\"head\":\"${BRANCH}\",\"merge_method\":\"merge\"}" \
            "$API/merges") || { echo "merge request failed (network)"; exit 1; }
          echo "merge http=$CODE body=$(cat /tmp/merge.json)"
          case "$CODE" in
            200|201|204) echo "Merged." ;;
            *) echo "merge failed (http $CODE) — leaving branch for manual resolution."; exit 1 ;;
          esac

      - name: Delete merged branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          CODE=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN missing}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/git/refs/heads/${GITHUB_REF_NAME}") || {
            echo "delete request failed (network)"; exit 1
          }
          echo "delete http=$CODE body=$(cat /tmp/del.json)"
          case "$CODE" in
            200|202|204) echo "Deleted branch ${GITHUB_REF_NAME}." ;;
            *) echo "delete failed (http $CODE) — non-fatal."; exit 0 ;;
          esac
