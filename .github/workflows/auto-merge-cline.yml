name: Auto-merge cline branches

# BlogForge / Cline worktrees push finished work to `cline/<id>` branches.
# This merges them straight into main so content deploys without manual
# intervention. Skips branches that are already contained in main, and
# deletes the branch after a successful merge.

on:
  push:
    branches:
      - 'cline/*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Safety: only ever merges into this repo.
    if: github.repository == 'JRone-git/pragmatic-sysadmin'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BRANCH="$GITHUB_REF_NAME"
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" --jq '.status')
          echo "compare main...$BRANCH => $STATUS"
          if [ "$STATUS" = "identical" ] || [ "$STATUS" = "behind" ]; then
            echo "::notice::$BRANCH is already merged into main — nothing to do."
            exit 0
          fi
          echo "Merging $BRANCH into main (merge commit)…"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main \
            -f head="$BRANCH" \
            -f merge_method=merge \
            --jq '.sha'
          echo "Merged."

      - name: Delete merged branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BRANCH="$GITHUB_REF_NAME"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            && echo "Deleted branch $BRANCH."
