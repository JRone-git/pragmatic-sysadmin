name: Auto-merge cline branches

# BlogForge / Cline worktrees push finished work to `cline/<id>` branches.
# This merges them straight into main so content deploys without manual
# intervention. Skips branches that are already contained in main, and
# deletes the branch after a successful merge.

on:
  push:
    branches:
      - 'cline/*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Safety: only ever merges into this repo.
    if: github.repository == 'JRone-git/pragmatic-sysadmin'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          echo "::notice::debug: token_len=${#GH_TOKEN} branch=${BRANCH} repo=${GITHUB_REPOSITORY}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          set +e
          COMPARE=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/compare/main...${BRANCH}" 2>/tmp/curlerr)
          CURL_RC=$?
          set -e
          if [ "$CURL_RC" -ne 0 ]; then
            echo "::error::compare curl failed rc=${CURL_RC} err=$(cat /tmp/curlerr)"
            exit 1
          fi
          STATUS=$(echo "$COMPARE" | python3 -c "import json,sys
          try: print(json.load(sys.stdin).get('status','?'))
          except Exception as e: print('parse-error:'+str(e))")
          echo "::notice::compare => status=${STATUS} head=$(echo "$COMPARE" | head -c 300)"
          case "$STATUS" in
            identical|behind)
              echo "::notice::${BRANCH} already merged into main — nothing to do."
              exit 0 ;;
            ahead|diverged) ;;
            *)
              echo "::error::unexpected compare status: ${STATUS}"
              exit 1 ;;
          esac
          set +e
          CODE=$(curl -sS -o /tmp/merge.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"base\":\"main\",\"head\":\"${BRANCH}\",\"merge_method\":\"merge\"}" \
            "$API/merges" 2>/tmp/curlerr2)
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            echo "::error::merge curl failed rc=${MERGE_RC} err=$(cat /tmp/curlerr2)"
            exit 1
          fi
          echo "::notice::merge http=${CODE} body=$(head -c 400 /tmp/merge.json)"
          case "$CODE" in
            200|201|204) echo "Merged." ;;
            *) echo "::error::merge failed with http ${CODE} — branch left for manual resolution."; exit 1 ;;
          esac

      - name: Delete merged branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          CODE=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN missing}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/git/refs/heads/${GITHUB_REF_NAME}") || {
            echo "delete request failed (network)"; exit 1
          }
          echo "delete http=$CODE body=$(cat /tmp/del.json)"
          case "$CODE" in
            200|202|204) echo "Deleted branch ${GITHUB_REF_NAME}." ;;
            *) echo "delete failed (http $CODE) — non-fatal."; exit 0 ;;
          esac
