<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Prompt Builder for Sysadmins</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    label { display: block; margin-top: 1em; }
    textarea, input[type=text] { width: 100%; padding: 0.5em; }
    button { margin-top: 1em; padding: 0.5em 1em; }
    .output { margin-top: 2em; background: #f4f4f4; padding: 1em; border-radius: 5px; }
  </style>
</head>
<body>
<!-- Pragmatic Sysadmin Global Navigation -->
<nav style="background:#0f172a; border-bottom:1px solid #334155; padding:0.6rem 1.25rem; display:flex; justify-content:space-between; align-items:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:0.875rem; color:#cbd5e1; z-index:99999; position:relative;">
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <a href="https://pragmaticsysadmin.help/" style="color:#f8fafc; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:0.4rem;">
      <span>🐧</span> Pragmatic Sysadmin
    </a>
    <span style="color:#475569;">|</span>
    <span style="color:#94a3b8;">Free Web Tools</span>
  </div>
  <div style="display:flex; gap:1.25rem; align-items:center;">
    <a href="https://pragmaticsysadmin.help/tools/" style="color:#93c5fd; text-decoration:none;">All Tools</a>
    <a href="https://pragmaticsysadmin.help/sysadmin/" style="color:#cbd5e1; text-decoration:none;">Guides</a>
    <a href="https://pragmaticsysadmin.help/" style="background:#2563eb; color:#fff; padding:0.25rem 0.65rem; border-radius:4px; text-decoration:none; font-weight:500; font-size:0.8rem;">Home →</a>
  </div>
</nav>

  <h1>AI Prompt Builder for Sysadmins</h1>
  <form id="promptForm">
    <label for="problem">Describe your IT problem or task:</label>
    <input type="text" id="problem" required>
    <label for="context">System Context (OS, app, environment):</label>
    <input type="text" id="context">
    <label for="goal">Desired Outcome:</label>
    <input type="text" id="goal">
    <label for="experience">Your Experience Level:</label>
    <select id="experience">
      <option value="basic">Basic</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
    <button type="submit">Generate AI Prompt</button>
  </form>
  <div class="output" id="output"></div>
  <script>
    document.getElementById('promptForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const problem = document.getElementById('problem').value;
      const context = document.getElementById('context').value;
      const goal = document.getElementById('goal').value;
      const experience = document.getElementById('experience').value;
      let prompt = `Problem: ${problem}\n`;
      if (context) prompt += `Context: ${context}\n`;
      if (goal) prompt += `Goal: ${goal}\n`;
      prompt += `Experience Level: ${experience}\n`;
      prompt += `Request: Please provide a step-by-step solution, and explain any commands or concepts for my experience level.`;
      document.getElementById('output').innerHTML = `<pre>${prompt}</pre>`;
    });
  </script>
</body>
</html>
